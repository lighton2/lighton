
<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="theme-color"
    content="#171718"
  />

  <meta name="robots" content="noindex, nofollow" />

  <title>تحميل Light On</title>


  <script src="../config.js?v=20261005-1"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at top,
          #29292c 0%,
          #171718 45%,
          #101011 100%
        );

      color: #ffffff;

      font-family:
        Arial,
        Tahoma,
        sans-serif;

      text-align: center;

      padding: 24px;
    }


    .box {

      width: 100%;
      max-width: 480px;

      background:
        rgba(255, 255, 255, 0.06);

      border:
        1px solid rgba(255, 255, 255, 0.1);

      border-radius: 24px;

      padding: 36px 24px;

      box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.35);

      backdrop-filter:
        blur(12px);

    }


    .logo {

      width: 90px;
      height: 90px;

      border-radius: 22px;

      margin-bottom: 18px;

    }


    h1 {

      margin:
        0 0 10px;

      font-size:
        28px;

    }


    p {

      color:
        #c9c9cf;

      line-height:
        1.8;

      margin:
        0 0 22px;

    }


    .version {

      display:
        inline-block;

      margin-bottom:
        22px;

      padding:
        7px 14px;

      border-radius:
        999px;

      background:
        rgba(255, 255, 255, 0.08);

      color:
        #ffffff;

      font-size:
        14px;

    }


    .download-button {

      width:
        100%;

      min-height:
        58px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        10px;

      border:
        0;

      border-radius:
        15px;

      background:
        linear-gradient(
          135deg,
          #1769ff,
          #0749c7
        );

      color:
        #ffffff;

      font-size:
        16px;

      font-weight:
        700;

      text-decoration:
        none;

      cursor:
        pointer;

      transition:
        0.2s ease;

    }


    .download-button:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 12px 32px
        rgba(23, 105, 255, 0.3);

    }


    .small {

      display:
        block;

      margin-top:
        18px;

      color:
        #85858d;

      font-size:
        12px;

    }

  </style>

</head>


<body>

  <div class="box">

    <img
      class="logo"
      src="../app-icon.png"
      alt="Light On"
    />


    <h1>
      Light On
    </h1>


    <div
      class="version"
      id="version"
    >
      أحدث إصدار
    </div>


    <p id="message">
      جاري تحويلك إلى رابط تحميل أحدث إصدار من MediaFire...
    </p>


    <a
      class="download-button"
      id="downloadButton"
      href="#"
    >
      تحميل من MediaFire
    </a>


    <span class="small">
      إذا لم يبدأ التحويل تلقائيًا، اضغط على زر التحميل.
    </span>

  </div>


  <script>

   

    const config =
      window.LIGHTON_CONFIG;


   
    if (
      !config ||
      !config.mediafireUrl
    ) {

      document.getElementById(
        "message"
      ).textContent =
        "حدث خطأ أثناء الحصول على رابط التحميل.";


      document.getElementById(
        "downloadButton"
      ).style.display =
        "none";

    }

    else {

      
      if (config.version) {

        document.getElementById(
          "version"
        ).textContent =
          "الإصدار " + config.version;

      }


     
      document.getElementById(
        "downloadButton"
      ).href =
        config.mediafireUrl;


     
      setTimeout(
        function () {

          window.location.replace(
            config.mediafireUrl
          );

        },
        700
      );

    }

  </script>

</body>

</html>
```
